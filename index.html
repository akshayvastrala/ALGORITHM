<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive visual playground for sorting, searching, and graph algorithms."
    />
    <title>Algorithm Lab — Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Algorithm Lab home">
          <span class="brand-mark" aria-hidden="true">⌘</span>
          <span>algorithm<span>lab</span></span>
        </a>
        <p class="eyebrow">Interactive Visualizer</p>
        <div class="status" aria-live="polite">
          <span class="status-dot"></span><span id="statusText">Ready to explore</span>
        </div>
      </header>

      <section class="control-panel" aria-label="Visualizer controls">
        <div class="algorithm-picker">
          <label for="algorithmSelect">Algorithm</label>
          <select id="algorithmSelect">
            <option value="bubble">Bubble Sort</option>
            <option value="merge">Merge Sort</option>
            <option value="binary">Binary Search</option>
            <option value="bfs">Breadth-First Search</option>
            <option value="dfs">Depth-First Search</option>
          </select>
        </div>

        <div class="control-divider" aria-hidden="true"></div>

        <div class="playback-controls">
          <button class="button button-primary" id="playButton" type="button">
            <span aria-hidden="true">▶</span> Play
          </button>
          <button class="button button-secondary" id="pauseButton" type="button" disabled>
            <span aria-hidden="true">⏸</span> Pause
          </button>
          <button class="button button-quiet" id="resetButton" type="button">
            <span aria-hidden="true">↻</span> Reset
          </button>
        </div>

        <div class="speed-control">
          <label for="speedRange">Speed <output id="speedLabel">1×</output></label>
          <input id="speedRange" type="range" min="1" max="3" value="1" step="1" />
        </div>
      </section>

      <section class="workspace" aria-label="Algorithm visualization">
        <div class="visualization-card">
          <div class="card-heading">
            <div>
              <p class="section-label">Live visualization</p>
              <h1 id="algorithmTitle">Bubble Sort</h1>
            </div>
            <div class="step-counter"><span id="stepCount">00</span> / <span id="totalSteps">10</span> steps</div>
          </div>

          <div class="stage" id="stage" aria-live="polite">
            <div class="sort-bars" id="sortBars" aria-label="Sortable values"></div>
            <div class="search-row hidden" id="searchRow" aria-label="Search values"></div>
            <div class="graph hidden" id="graph" aria-label="Graph traversal"></div>
          </div>

          <div class="legend" id="legend"></div>
        </div>

        <aside class="insight-card">
          <p class="section-label">At a glance</p>
          <div class="complexity-grid">
            <div><span>Time</span><strong id="timeComplexity">O(n²)</strong></div>
            <div><span>Space</span><strong id="spaceComplexity">O(1)</strong></div>
          </div>
          <div class="code-window">
            <div class="window-bar"><span></span><span></span><span></span><small id="codeLabel">bubble_sort.js</small></div>
            <pre id="codeSnippet"><code>for each pair (a, b)
  if a &gt; b
    swap(a, b)</code></pre>
          </div>
          <p class="hint" id="hintText">Compare adjacent values and swap them when they are out of order.</p>
        </aside>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
